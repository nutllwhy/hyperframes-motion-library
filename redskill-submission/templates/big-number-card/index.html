<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"eyebrow","type":"string","label":"角标","default":"核心结论"},{"id":"prefix","type":"string","label":"前缀","default":"效率提升"},{"id":"value","type":"number","label":"数字","default":3.2},{"id":"unit","type":"string","label":"单位","default":"倍"},{"id":"caption","type":"string","label":"说明","default":"同样的选题流程，AI 参与后从整理资料到产出初稿明显提速。"},{"id":"accent","type":"color","label":"强调色","default":"#FF5A36"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html[data-export-mode="mp4"] body,html[data-export-mode="mp4"] #root{background:#12100E!important}
      *{box-sizing:border-box} html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent} body{font-family:sans-serif}
      #root{position:relative;width:1920px;height:1080px;color:var(--fg);background:transparent;overflow:hidden}
      .scene{width:100%;height:100%;padding:82px 108px 78px}
      .card{position:relative;width:100%;height:100%;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(480px,.88fr);grid-template-rows:auto 1fr;column-gap:96px}
      .card:before{content:"";position:absolute;left:0;right:0;top:0;height:8px;background:linear-gradient(90deg,var(--accent) 0 38%,color-mix(in srgb,var(--accent) 18%,transparent) 38%)}
      .eyebrow{grid-column:1/-1;justify-self:start;margin-top:58px;display:inline-flex;padding:12px 18px;border:2px solid color-mix(in srgb,var(--accent) 72%,transparent);color:var(--accent);font:800 25px/1 "IBM Plex Mono",monospace;letter-spacing:.08em}
      .metric{align-self:center;min-width:0}.prefix{font-size:92px;font-weight:900;letter-spacing:-.05em}.number-row{display:flex;align-items:flex-end;gap:26px;margin-top:54px}
      .value{color:var(--accent);font-size:360px;font-weight:950;line-height:.7;letter-spacing:-.08em;font-variant-numeric:tabular-nums}.unit{padding-bottom:24px;color:var(--accent);font-size:100px;font-weight:900}

    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
      <section id="big-number-scene" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <div class="card"><div id="eyebrow" class="eyebrow"></div><div class="metric"><div id="prefix" class="prefix"></div><div class="number-row"><span id="value" class="value"></span><span id="unit" class="unit"></span></div></div><div class="caption-wrap"><div id="caption" class="caption"></div></div></div>
      </section>
    </div>
    <script>
      const fallback={eyebrow:"核心结论",prefix:"效率提升",value:3.2,unit:"倍",caption:"同样的选题流程，AI 参与后从整理资料到产出初稿明显提速。",accent:"#FF5A36",foreground:"#F4EFE7"};
      const v=window.__hyperframes?.getVariables?window.__hyperframes.getVariables():fallback;document.documentElement.dataset.exportMode=v.exportMode||"transparent";document.documentElement.style.setProperty("--accent",v.accent);document.documentElement.style.setProperty("--fg",v.foreground);
      for(const id of ["eyebrow","prefix","value","unit","caption"])document.getElementById(id).textContent=v[id];
      window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});
      tl.from(".card",{opacity:0,y:64,scale:.97,duration:.7,ease:"expo.out"},.15).from(".eyebrow",{opacity:0,x:-30,duration:.35,ease:"power3.out"},.45).from(".prefix",{opacity:0,y:35,duration:.45,ease:"power3.out"},.58).from(".value",{opacity:0,scale:.55,transformOrigin:"left bottom",duration:.75,ease:"back.out(1.5)"},.78).from(".unit",{opacity:0,y:36,duration:.36,ease:"power2.out"},1.12).from(".caption-wrap",{opacity:0,x:42,duration:.48,ease:"power3.out"},1.22).to(".scene",{opacity:0,y:-24,duration:.42,ease:"power2.in"},4.45);
      window.__timelines.main=tl;
    </script>
  </body>
</html>
