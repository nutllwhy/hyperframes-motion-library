<!doctype html>
<html lang="zh-CN" data-composition-variables='[{"id":"title","type":"string","label":"标题","default":"成片有问题，不用推倒重来"},{"id":"step1","type":"string","label":"步骤一","default":"成片"},{"id":"step2","type":"string","label":"步骤二","default":"时间码复盘"},{"id":"step3","type":"string","label":"步骤三","default":"局部重写"},{"id":"step4","type":"string","label":"步骤四","default":"再生成"},{"id":"takeaway","type":"string","label":"闭环结论","default":"问题沉淀为下一版规则"},{"id":"accent","type":"color","label":"强调色","default":"#FF5A36"},{"id":"foreground","type":"color","label":"文字色","default":"#F4EFE7"},{"id":"exportMode","type":"enum","label":"导出模式","default":"transparent","hidden":true,"options":[{"value":"transparent","label":"透明背景"},{"value":"mp4","label":"剪映 MP4 深色底"}]}]'>
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      body { font-family: sans-serif; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--fg); }
      .backdrop { position: absolute; inset: 0; opacity: 0; background: #12100e; }
      html[data-export-mode="mp4"] .backdrop { opacity: 1; }
      .scene { position: absolute; inset: 0; padding: 82px 108px 78px; }
      .loop { position: relative; width: 100%; height:100%; overflow: hidden; }
      .loop::before { content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 5px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 16%, transparent)); }
      .title { position: relative; z-index: 2; padding-top:58px;font-size: 82px; line-height: 1.1; font-weight: 900; letter-spacing: -.05em; }
      .flow { position: relative; z-index: 2; height: 650px; margin-top: 48px; }
      .steps { position: absolute; left: 0; right: 0; top: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 70px; }
      .step { position: relative; min-height: 320px; padding: 42px 26px; display: flex; flex-direction: column; justify-content: center; border-bottom: 5px solid color-mix(in srgb, var(--accent) 54%, transparent); }
      .step-number { color: var(--accent); font-size: 34px; line-height: 1; font-weight: 900; }
      .step-text { margin-top: 34px; color: var(--fg); font-size: 48px; line-height: 1.2; font-weight: 880; white-space: nowrap; }
      .arrow { position: absolute; top: 150px; right: -55px; width: 40px; height: 26px; }
      .arrow::before { content: ""; position: absolute; left: 0; top: 11px; width: 38px; height: 4px; background: var(--accent); }
      .arrow::after { content: ""; position: absolute; right: 0; top: 5px; width: 14px; height: 14px; border-top: 4px solid var(--accent); border-right: 4px solid var(--accent); transform: rotate(45deg); }
      .step:last-child .arrow { display: none; }
      .return-path { position: absolute; left: 34px; right: 34px; top: 390px; height: 132px; border-left: 4px solid var(--accent); border-right: 4px solid var(--accent); border-bottom: 4px solid var(--accent); }
      .return-path::after { content: ""; position: absolute; left: -9px; top: -2px; width: 14px; height: 14px; border-top: 4px solid var(--accent); border-left: 4px solid var(--accent); transform: rotate(45deg); }
      .takeaway { position: absolute; left: 50%; top: 478px; transform: translateX(-50%); padding: 16px 30px; color: var(--accent); background: #17130f; border: 2px solid var(--accent); font-size: 30px; line-height: 1.2; font-weight: 850; white-space: nowrap; }
      .takeaway::before { content: "↺"; margin-right: 14px; font-size: 36px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1920" data-height="1080">
      <div class="backdrop"></div>
      <section id="iteration-loop-scene" class="scene clip" data-start="0" data-duration="4.2" data-track-index="1">
        <div class="loop">
          <div id="title" class="title"></div>
          <div class="flow">
            <div class="steps">
              <div class="step"><div class="step-number">01</div><div id="step1" class="step-text"></div><span class="arrow"></span></div>
              <div class="step"><div class="step-number">02</div><div id="step2" class="step-text"></div><span class="arrow"></span></div>
              <div class="step"><div class="step-number">03</div><div id="step3" class="step-text"></div><span class="arrow"></span></div>
              <div class="step"><div class="step-number">04</div><div id="step4" class="step-text"></div><span class="arrow"></span></div>
            </div>
            <div class="return-path"></div><div id="takeaway" class="takeaway"></div>
          </div>
        </div>
      </section>
    </div>
    <script>
      const fallback = { title: "成片有问题，不用推倒重来", step1: "成片", step2: "时间码复盘", step3: "局部重写", step4: "再生成", takeaway: "问题沉淀为下一版规则", accent: "#FF5A36", foreground: "#F4EFE7", exportMode: "transparent" };
      const v = window.__hyperframes?.getVariables ? window.__hyperframes.getVariables() : fallback;
      document.documentElement.dataset.exportMode = v.exportMode || "transparent";
      document.documentElement.style.setProperty("--accent", v.accent); document.documentElement.style.setProperty("--fg", v.foreground);
      for (const id of ["title", "step1", "step2", "step3", "step4", "takeaway"]) document.getElementById(id).textContent = v[id];
      window.__timelines = window.__timelines || {}; const tl = gsap.timeline({ paused: true });
      tl.fromTo(".loop", { opacity: 0, y: 48, scale: .98 }, { opacity: 1, y: 0, scale: 1, duration: .42, ease: "expo.out" }, .12)
        .fromTo(".title", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: .34, ease: "circ.out" }, .2)
        .fromTo(".step", { opacity: 0, y: 32, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .4, stagger: .12, ease: "back.out(1.25)" }, .31)
        .fromTo(".arrow", { opacity: 0, scaleX: .25, transformOrigin: "left center" }, { opacity: 1, scaleX: 1, duration: .26, stagger: .12, ease: "power3.out" }, .52)
        .fromTo(".return-path", { opacity: 0, scaleX: .18, transformOrigin: "right center" }, { opacity: 1, scaleX: 1, duration: .52, ease: "power4.out" }, .85)
        .fromTo(".takeaway", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: .32, ease: "expo.out" }, 1.05)
        .to(".takeaway", { scale: 1.035, duration: .62, yoyo: true, repeat: 1, ease: "sine.inOut" }, 1.46)
        .to(".scene", { opacity: 0, y: -18, duration: .3, ease: "power3.in" }, 3.82)
        .set(".scene", { opacity: 0 }, 4.12);
      window.__timelines.main = tl;
    </script>
  </body>
</html>
